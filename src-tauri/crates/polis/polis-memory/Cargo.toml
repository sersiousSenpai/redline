[package]
name = "polis-memory"
version = "0.1.0"
description = "Polis Memory — the crate integrators add: the Polis handle implementing MemoryApi over the store, retrieval (the answer pack, timeline, map), the autonomous gardener (organize, compaction, observations, the semantic index), bundle export and the markdown mirror. Re-exports polis-core, polis-store, polis-llm and polis-embed."
authors = ["Yusuf Al-Bazian"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sersiousSenpai/polis-memory"

[features]
default = []
# Apple's on-device embedder (macOS) — Redline turns it on.
apple = ["polis-embed/apple"]

[dependencies]
polis-core = { path = "../polis-core" }
polis-store = { path = "../polis-store" }
polis-llm = { path = "../polis-llm" }
polis-embed = { path = "../polis-embed" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
