[package]
name = "polis-core"
version = "0.1.0"
description = "Polis Memory core: the hash-chained ledger vocabulary, the class-catalog proposal grammar, the answer-pack types and budget, bundle verification, and the MemoryApi trait. Pure — no I/O, no database."
authors = ["Yusuf Al-Bazian"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sersiousSenpai/polis-memory"

# Deliberately tiny and I/O-free: serde + sha2 and nothing else. This crate is
# the ONE vocabulary the store, the server, the MCP server and the generated
# clients compile against, and it must verify a bundle without SQLite. Adding
# rusqlite, tokio, axum or any platform crate here is a design error — those
# belong in polis-store / polis-server / polis-llm / polis-embed.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
