# The `redline-mcp` stdio proxy as its own workspace member (size lever,
# docs/perf-budget.md "Size budget"): as a `src/bin/` of the app package the
# proxy linked all of `redline_lib` — tauri, whisper, syntect — and weighed
# ~28 MB. On its own it is the pure JSON-RPC core plus one blocking HTTP
# client. It must never depend on `redline_lib` (tests/size_guard.rs pins
# this); the app depends on nothing here either — the two build independently.
[package]
name = "redline-mcp"
version = "0.1.0"
description = "Read-only stdio MCP proxy over a locally running Redline"
authors = ["Yusuf Al-Bazian"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sersiousSenpai/redline"

[dependencies]
serde_json = "1"
# The proxy only ever GETs http://127.0.0.1 — no TLS backend, no charset
# sniffing, no system proxy detection. Default features off keeps the release
# binary small when this crate is built on its own feature set.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking"] }
