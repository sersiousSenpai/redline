[package]
name = "redline"
version = "0.1.0"
description = "Companion app for Claude Code that turns plan-mode review into a track-changes workflow"
authors = ["Yusuf Al-Bazian"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sersiousSenpai/redline"
# `tauri dev` invokes a bare `cargo run`; this pins it to the app package so
# a future default-member bin can never make it refuse to pick.
default-run = "redline"

# Workspace for the extension crates (the ABI every extension compiles
# against, and the SDK). The `redline-mcp` stdio proxy that used to live here
# retired on 2026-09-07: the daemon serves MCP itself at `/mcp` (streamable
# HTTP, `polis-mcp`), so an external session needs no bundled binary. `cargo
# build` / `cargo test` / `tauri dev` invoke cargo without `-p`, so
# default-members keeps the extension crates building and tested.
[workspace]
members = [
    "crates/redline-extension-abi",
    "crates/redline-extension-sdk",
]
default-members = [
    ".",
    "crates/redline-extension-abi",
    "crates/redline-extension-sdk",
]

[lib]
name = "redline_lib"
# Desktop-only: the app binary consumes the lib as an rlib. `staticlib`/`cdylib`
# exist for mobile targets we don't build; producing all three link kinds costs
# an extra full link of a ~30 MB artifact nothing consumes, on every build.
# Restore the others if iOS/Android targets ever land.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
toml = "0.8"
# `unstable` enables the multi-webview API (embedding a native child webview
# inside the main window — the embedded browser pane). It's the only supported
# way to do in-window child webviews in Tauri 2 today; the JS `new Webview(...)`
# path requires it on the Rust side too.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
# Codex's local Unix socket uses WebSocket framing. No TLS or TCP listener:
# the launcher creates a private socket for its own terminal's app-server.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
# SHA-256 for the append-only prompt/decision ledger's hash chain
# (entry_hash = sha256(prev_hash ‖ canonical-json(event))). Not previously a dep.
sha2 = "0.10"
similar = "2"
portable-pty = "0.8"
base64 = "0.22"
notify-debouncer-mini = "0.4"
# Oniguruma regex backend (the same engine VS Code uses) for the read-only file
# viewer's syntax highlighting. We measured the pure-Rust `fancy-regex` backend
# compiling the TypeScript/TSX grammars ~50-60x slower (2.4s cold vs ~40ms in a
# debug build), which showed as a multi-second "Loading…" on the first open;
# oniguruma makes the first open instant. It builds oniguruma from C source, but
# this is already a native (Tauri) build with a C toolchain, so it adds no new
# class of build dependency. Tokenizes off the UI thread.
syntect = { version = "5", default-features = false, features = ["default-onig"] }
# Extended grammar set (bat's curated, permissive-only syntaxes) — adds the
# TypeScript/TSX/JSX grammars that syntect's bundled defaults lack, so .ts/.tsx
# files highlight instead of falling back to plain text. `syntect-default-fancy`
# pins the same fancy-regex syntect build as above. Bundled-asset attributions
# live in THIRD_PARTY_NOTICES.md (from two_face::acknowledgement::listing()).
# `syntect-default-onig` pins the same oniguruma syntect build as above.
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
# HTTP client for the voice agent's premium (cloud) TTS — the synth call is made
# from Rust so the user's API key never enters the webview and there's no browser
# CORS. Default TLS (Security.framework on macOS), JSON bodies. `blocking` is
# deliberately ABSENT: its only user was the retired `redline-mcp` proxy, and
# the feature is a size lever nothing in the app needs (docs/perf-budget.md;
# `size_guard.rs` pins its absence).
reqwest = { version = "0.13.4", features = ["json"] }
# Resample the microphone's hardware-rate PCM (44.1/48 kHz) down to the 16 kHz
# mono Whisper expects. Pure Rust (no C build); used by the batch Whisper
# dictation backend to prepare the accumulated utterance before inference.
rubato = "0.16"
tauri-plugin-deep-link = "2.4.9"
# WASM extension host (B3): shared ABI vocabulary (event payloads, host-call
# types, scope/event name constants) — path dep during development, published
# to crates.io with the first marketplace release.
redline-extension-abi = { path = "crates/redline-extension-abi" }
# Pure-Rust WebAssembly interpreter running `kind: "wasm"` extensions
# in-process. Chosen over a JIT runtime deliberately: +~1.5 MB vs +8-12 MB
# (small-binary pillar), and v1 extensions are glue — event in, a few
# `host_call`s out — where interpreter overhead is milliseconds. The runtime
# sits behind `extension_host::Runtime`; a feature-gated JIT (`ext-jit`)
# stays purely additive if an extension ever proves compute-bound.
wasmi = "1.1"
# Polis Memory (Program A of the Polis extraction, docs/polis-extraction.md):
# the memory system as six crates from its own repo, pinned by git rev since
# Session A7 (a crates.io version later). Bump the rev deliberately, in its
# own commit; `polis_deps_stay_lean` in tests/size_guard.rs pins that these
# lines never enable a fattening feature (`cli`, `standalone`, `anthropic`,
# `openai-compat`) and that every polis crate resolves from this one source.
#
# The core: the ledger vocabulary + hashing, the proposal grammar, the
# answer-pack types and budget, bundle verification and the MemoryApi trait.
# Pure (serde + sha2), so it adds nothing to the binary that was not already
# linked.
polis-core = { git = "https://github.com/sersiousSenpai/polis-memory", rev = "911d24e4348e9906b4fe6cc7a57d44e1dceceede" }
# The memory schema + its own `polis_meta` versioning + the cross-process-safe
# chain append (A2). Same rusqlite as the app, so one SQLite is linked.
polis-store = { git = "https://github.com/sersiousSenpai/polis-memory", rev = "911d24e4348e9906b4fe6cc7a57d44e1dceceede" }
# The semantic arm (A3): providers, vector cache, search, index tick. `apple`
# is the on-device backend this app has always used; the objc2 crates it needs
# were already in the graph (below), so the feature costs no new build edge.
polis-embed = { git = "https://github.com/sersiousSenpai/polis-memory", rev = "911d24e4348e9906b4fe6cc7a57d44e1dceceede", features = ["apple"] }
# The Agent trait the memory seats speak (A4). Default features only: the
# CLI backends; the HTTP backends would add a second reqwest to this graph.
polis-llm = { git = "https://github.com/sersiousSenpai/polis-memory", rev = "911d24e4348e9906b4fe6cc7a57d44e1dceceede" }
# THE crate an integrator adds (A5): the Polis handle, retrieval, the gardener,
# export, the mirror, the classmemory skill text. `apple` = the on-device
# embedder this app has always used.
polis-memory = { git = "https://github.com/sersiousSenpai/polis-memory", rev = "911d24e4348e9906b4fe6cc7a57d44e1dceceede", features = ["apple"] }
# The HTTP surface (A6): the memory + context routes this daemon used to
# define inline, the ROUTES table its auth contract maps in, the capture
# route with Redline's `IngestObserver` behind it, and the hook installer.
# Default features only: `standalone` (bind + token) is the `polis` daemon's.
polis-server = { git = "https://github.com/sersiousSenpai/polis-memory", rev = "911d24e4348e9906b4fe6cc7a57d44e1dceceede" }
# The Model Context Protocol surface (E1): the read tools over the same
# `MemoryApi`, served by this daemon at `/mcp` (streamable HTTP) so an
# external `claude mcp add --transport http` needs no bundled binary — the
# `redline-mcp` proxy crate retired with it. Default features only: `remote`
# (an HTTP client for the `polis` binary) would add a second HTTP stack.
polis-mcp = { git = "https://github.com/sersiousSenpai/polis-memory", rev = "911d24e4348e9906b4fe6cc7a57d44e1dceceede" }
# Deflate for the compaction archive (`prompt_archive`): a cold compaction
# releases a body at ~59:1 and used to be irrecoverable. Already present in the
# dependency tree (via `png` → `tauri-utils`), so naming it here is a visibility
# change, not a new build edge or a new binary-size line — verified against
# Cargo.lock before adding, per the small-binary pillar.
flate2 = "1"
# The grep arm's regex VERIFIER — applied in Rust to the candidate set the
# trigram index returned, never inside SQL.
#
# `regex-lite`, NOT `regex`, and the difference was measured rather than
# assumed: `regex` IS already in the dependency tree (via `tauri-utils`), which
# made it look free, but naming it as a direct dependency and actually calling
# it pulled its DFA/meta engine and Unicode tables into our binary for
# **+529 KB** (26.96 MB → 27.50 MB on an identical tree). Against ~1 MB of
# headroom under the 28 MB ceiling, that is not a rounding error.
#
# `regex-lite` is also the right engine for the job on its merits: this pattern
# runs over at most a few hundred short candidate strings that a trigram index
# already narrowed, so a DFA's compile cost dominates any matching it saves.
# Same API, backtracking engine, no Unicode tables.
regex-lite = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Local Whisper (whisper.cpp) speech-to-text as the higher-quality, pluggable
# alternative to Apple's `SFSpeechRecognizer` (`dictation_whisper.rs`). The
# `metal` feature GPU-accelerates inference on Apple silicon; whisper.cpp is
# compiled from source at build time (needs `cmake` on the build machine) and
# statically linked, so end users install nothing — the ~140 MB model is
# downloaded lazily into the app data dir, like the Kokoro TTS model.
whisper-rs = { version = "0.14", features = ["metal"] }
# Enable WKWebView's back/forward swipe gestures on the embedded browser.
# Tauri 2.11 doesn't expose `setAllowsBackForwardNavigationGestures`, so we
# reach the WKWebView via `with_webview()` and send the selector with objc2
# (already in the dependency tree via wry/tauri).
objc2 = "0.6"
# Build the WKWebView `evaluateJavaScript:completionHandler:` block used by
# `browser_scrape` to read the live page DOM back into Rust (already in the tree
# via wry/objc2).
block2 = "0.6"
# Native on-device speech-to-text (`dictation.rs`, push-to-talk). The typed
# objc2 framework crates give compile-checked Speech / AVFAudio methods and
# `Retained<T>` lifetime safety (vs. hand-rolled `msg_send!`), which matters
# because the unsafe audio/TCC path can't be exercised by `cargo test` — only by
# a signed run. They also emit the `-framework Speech` / `AVFAudio` link
# directives, so no `build.rs` linker lines are needed. Same objc2 0.6 family
# already in the tree via wry/tauri.
objc2-speech = "0.3.2"     # SFSpeechRecognizer + recognition request/result/task
# On-device text embeddings for memory's semantic arm (`embed.rs`). An OS
# SERVICE, not a bundled model: zero model bytes in the binary, assets managed
# by macOS, inference on the Neural Engine. That is what retires the old "no
# embedding model enters the product" law — its real concerns were binary size
# and auditability, and both are met directly (measure with
# `node scripts/check-size.mjs`; every hit is labelled with the arm that found
# it). Default features off: we need the two embedding APIs and nothing else
# from the Natural Language framework.
objc2-natural-language = { version = "0.3.2", default-features = false, features = [
    "std", "NLEmbedding", "NLContextualEmbedding", "NLLanguage", "block2",
] }
objc2-avf-audio = "0.3.2"  # AVAudioEngine mic tap + PCM buffers
objc2-foundation = "0.3.2" # NSString/NSLocale/NSError bridging
# Typed WKWebView + AppKit classes for the embedded browser's new-window
# (OAuth/SSO popup) support: our own `WKUIDelegate` returns a real WebKit-created
# child webview from `createWebView…` — the only way `window.opener`,
# `window.close()`, and `.closed` work — and hosts it in a floating `NSWindow`.
# The feature lists are wry 0.55's (same crate versions already resolved in the
# tree, so Cargo feature-unification adds no extra build and every class the
# delegate touches is guaranteed present) PLUS the few `thumbs.rs` needs for the
# Localhost dashboard's screenshots — `WKSnapshotConfiguration` to ask WebKit for
# a downscaled snapshot, and the NSImage/NSImageRep/NSBitmapImageRep trio to
# encode the result as PNG. Both additions are purely additive: they pull only
# objc2-foundation features already switched on, so the build cost is unchanged.
# Without the wry-matching baseline, WebKit routes new-window requests to wry's
# UI delegate, which has no new-window handler and drops them.
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std", "objc2-core-foundation", "objc2-app-kit", "block2",
    "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKDownload",
    "WKDownloadDelegate", "WKNavigation", "WKNavigationDelegate",
    "WKUserContentController", "WKURLSchemeHandler", "WKPreferences",
    "WKURLSchemeTask", "WKScriptMessageHandler", "WKUIDelegate",
    "WKOpenPanelParameters", "WKFrameInfo", "WKSecurityOrigin", "WKScriptMessage",
    "WKNavigationAction", "WKWebpagePreferences", "WKNavigationResponse",
    "WKUserScript", "WKHTTPCookieStore", "WKWindowFeatures",
    "WKSnapshotConfiguration",
] }
# NSImage arrives transitively via objc2-web-kit's `objc2-app-kit` feature, but
# name it explicitly — `NSImageRep` is what gates the `representationUsingType:
# properties:` impl block we call, and a feature we depend on shouldn't be
# somebody else's implementation detail.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "objc2-core-foundation", "NSApplication", "NSButton", "NSControl",
    "NSEvent", "NSWindow", "NSView", "NSPasteboard", "NSPanel", "NSResponder",
    "NSOpenPanel", "NSSavePanel", "NSMenu", "NSGraphics", "NSScreen",
    "NSImage", "NSImageRep", "NSBitmapImageRep",
] }

[dev-dependencies]
# Assemble the extension host's inline test fixtures (real wasm modules from
# `wat` text) — test-only; the shipped host consumes `.wasm` bytes.
wat = "1"
# Drive the merged polis router with real requests in `auth.rs`'s
# `merged_router_covers_every_polis_route` (tower's `oneshot`, the body
# collector). Both already in the graph; test-only here.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Parse the Codex config profile Redline writes (`codex_profile.rs`) back out
# in tests. The contract is delivered to a Codex plan session through that file
# and nowhere else, so an escaping bug that drops part of it would be silent
# until a revision destroyed a diff — a real round-trip is the only assertion
# that catches it. Test-only: nothing in the shipped binary reads TOML.

# Size levers for the shipped binary (budget + baselines: docs/perf-budget.md
# "Size budget"; pinned by src-tauri/tests/size_guard.rs so a revert fails
# `cargo test` even though tests build in debug).
#
# `panic` stays on the default "unwind" DELIBERATELY, despite ~2 MB of unwind
# tables: thread/task panics must stay contained (a panicking command kills a
# task, not the app mid-review), and the extension host's crash isolation is
# built on `catch_unwind`, which `abort` would silently disable.
[profile.release]
# Cross-crate inlining/DCE and generic dedup across the 600+-crate graph, where
# the tauri/wry/axum/serde monomorphization bloat lives. "fat" buys ~0.5-1 MB
# more at 2-3x the link time — not worth it as the everyday profile.
lto = "thin"
codegen-units = 1
# ~64k symbols + string table on a 30 MB Mach-O. macOS keeps debug info out of
# the binary anyway (OSO/dSYM), so local debugging loses nothing; release-CI
# dSYM extraction runs before bundling.
strip = "symbols"

