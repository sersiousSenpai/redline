# The studio voice's Python packages: exact pins, macOS arm64 wheels only.
# Installed with `uv pip install --require-hashes --no-deps --no-build`, so
# nothing outside this list is resolved, built or downloaded. Regenerate
# from the spike lock when a pin moves; tts_studio.rs embeds it deflated.
# mlx-lm (with Jinja2 and MarkupSafe for its chat templates) runs the
# dictation polish model; onnxruntime (with the flatbuffers and protobuf it
# requires) runs the end-of-turn model where Kokoro isn't installed
# (turn_scorer.rs); the rest is the voice's.
