<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redline</title>
    <!-- Pre-paint theme bootstrap: replay the cached theme variables before the
         JS bundle (and even styles.css) load, so the very first frame is already
         in the user's theme — never a flash of white. Kept in sync with
         applyTheme.ts (VARS_KEY = "redline.themeVars"). -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var raw = localStorage.getItem("redline.themeVars");
          if (raw) {
            var vars = JSON.parse(raw);
            for (var k in vars) {
              if (Object.prototype.hasOwnProperty.call(vars, k)) {
                el.style.setProperty(k, vars[k]);
              }
            }
            if (vars["--color-paper"])
              el.style.backgroundColor = vars["--color-paper"];
            if (vars["--color-ink"]) el.style.color = vars["--color-ink"];
          }
          /* Replay the chosen app font (independent of the color theme), kept
             in sync with applyTheme.ts (FONT_STACK_KEY = "redline.fontStack"). */
          var f = localStorage.getItem("redline.fontStack");
          if (f) el.style.setProperty("--font-sans", f);
          /* Replay the plaintext-lint theme as the data-lint attribute so the
             editor's token coloring is right on first paint, kept in sync with
             applyTheme.ts (LINT_KEY = "redline.lint"). */
          var lint = localStorage.getItem("redline.lint");
          if (lint) el.setAttribute("data-lint", lint);
          if (!raw) {
            /* First-ever launch: match the Terminal (default) theme so the
               first paint is its blue-black, never white. Kept in sync with
               THEMES' terminal entry (themes.ts). */
            el.style.backgroundColor = "#0a0e16";
            el.style.color = "#d6e1ef";
          }
        } catch (e) {
          /* localStorage unavailable — fall through to stylesheet defaults */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
